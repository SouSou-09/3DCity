<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3DCity</title>
  </head>
  <body>
    <canvas id="map"></canvas>
    <canvas id="scene"></canvas>
    <div id="panel">
      <h1>3DCity <small>M1 道路網</small></h1>
      <label>シード <input id="seed" type="number" min="0" step="1" /></label>
      <div class="row">
        <button id="generate">生成</button>
        <button id="random">ランダム</button>
      </div>
      <div class="row">
        <button id="mode2d">2D地図</button>
        <button id="mode3d">3Dプレビュー</button>
      </div>
      <p class="hint"><a href="catalog.html">道路アセットのカタログ(テクスチャ・3Dモデル)</a></p>
      <fieldset id="layers">
        <legend>表示</legend>
        <label><input type="checkbox" data-layer="land" /> 用途と敷地・駅</label>
        <label><input type="checkbox" data-layer="districts" /> 地区</label>
        <label><input type="checkbox" data-layer="nodes" /> 交差点</label>
        <label><input type="checkbox" data-layer="field" /> 方向場</label>
        <label><input type="checkbox" data-layer="raw" /> 生成直後の線</label>
      </fieldset>
      <div id="legend"></div>
      <pre id="stats"></pre>
      <p class="hint">ドラッグで移動(3Dは回転、右ドラッグで移動) / ホイールで拡大縮小</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
